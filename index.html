<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#05080f">
<meta name="description" content="AI BASEBALL · 青少年棒球投球 / 打击 / 垒球投球 动作分析（端侧姿态估计原型）">
<title>AI BASEBALL · 青少年棒球 / 垒球动作分析</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:#05080f;color:#e9f0ff;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex;flex-direction:column;
  }

  /* ---------- 顶部模式切换栏 ---------- */
  #bar{
    flex:none;position:relative;z-index:20;
    background:linear-gradient(180deg,#0d1729,#0a1120);
    border-bottom:1px solid #1f2c45;
    padding:calc(7px + env(safe-area-inset-top,0px)) 12px 7px;
  }
  .wrap{max-width:430px;margin:0 auto;display:flex;align-items:center;gap:9px}
  .brand{
    display:flex;align-items:center;gap:6px;flex:none;
    font-size:11px;font-weight:800;letter-spacing:.6px;color:#6b81a5;white-space:nowrap;
  }
  .brand .dot{
    width:7px;height:7px;border-radius:99px;flex:none;
    background:linear-gradient(135deg,#22d3ee,#3b82f6);
    box-shadow:0 0 8px rgba(34,211,238,.65);
  }
  .seg{
    display:flex;gap:3px;background:#0b1424;border:1px solid #1f2c45;
    border-radius:11px;padding:3px;flex:1;min-width:0;
  }
  .tab{
    flex:1;min-width:0;border:none;background:transparent;color:#93a8ca;
    font-family:inherit;font-size:11.5px;font-weight:700;letter-spacing:0;
    padding:8px 3px;border-radius:8px;cursor:pointer;white-space:nowrap;
    display:flex;align-items:center;justify-content:center;gap:3.5px;
    transition:background .18s ease,color .18s ease,box-shadow .18s ease;
  }
  .tab svg{flex:none;opacity:.9;width:12px;height:12px}
  .tab:active{transform:scale(.98)}
  .tab.on{
    background:linear-gradient(135deg,#1d4ed8,#0ea5e9);color:#fff;
    box-shadow:0 2px 10px rgba(29,78,216,.4);
  }
  /* ---------- 版本徽章 ---------- */
  .ver{
    flex:none;font-size:10px;font-weight:800;letter-spacing:.3px;color:#5f7398;
    background:#0b1424;border:1px solid #1f2c45;border-radius:7px;padding:5px 7px;
    white-space:nowrap;cursor:pointer;font-variant-numeric:tabular-nums;
    transition:color .18s ease,border-color .18s ease,background .18s ease;
  }
  .ver:active{transform:scale(.96)}
  .ver.stale{color:#fbbf24;border-color:rgba(245,158,11,.45);background:rgba(245,158,11,.09)}
  @media(max-width:480px){ .brand{display:none} }
  @media(max-width:360px){ .tab{font-size:10.5px;gap:2px} .ver{padding:5px 5px} }

  /* ---------- 内容区 ---------- */
  #stage{flex:1;position:relative;min-height:0;background:#05080f}
  .frame{
    position:absolute;inset:0;width:100%;height:100%;border:0;
    display:none;background:#05080f;
  }
  .frame.on{display:block}

  /* ---------- 载入 / 更新遮罩 ---------- */
  #load{
    position:absolute;inset:0;z-index:10;pointer-events:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    background:#05080f;opacity:1;transition:opacity .28s ease;
  }
  #load.off{opacity:0}
  .spin{
    width:26px;height:26px;border-radius:50%;
    border:2.5px solid #1f2c45;border-top-color:#3b82f6;
    animation:sp .8s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
  .lt{font-size:11.5px;color:#5f7398;letter-spacing:.4px}

  /* ---------- 底部提示（仅桌面端） ---------- */
  @media(min-width:900px){
    #hint{
      position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
      font-size:11px;color:#3f5273;letter-spacing:.3px;z-index:11;
      pointer-events:none;transition:opacity .5s ease;white-space:nowrap;
    }
    #hint.off{opacity:0}
  }
  @media(max-width:899px){ #hint{display:none} }
</style>
</head>
<body>

<div id="bar">
  <div class="wrap">
    <div class="brand"><span class="dot"></span>AI BASEBALL</div>
    <div class="seg" id="seg">
      <button class="tab on" data-mode="pitch" type="button">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="9"/><path d="M4.5 5.5c3 3 3.6 9.4 1.2 13M19.5 5.5c-3 3-3.6 9.4-1.2 13"/>
        </svg>
        棒球投球
      </button>
      <button class="tab" data-mode="hit" type="button">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 3.5 20 9M17.5 6.5 8 16l-3.5 7L11 19.5 20.5 10z"/>
        </svg>
        打击分析
      </button>
      <button class="tab" data-mode="soft" type="button">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17M5 6c2.6 3.4 2.6 8.6 0 12M19 6c-2.6 3.4-2.6 8.6 0 12"/>
        </svg>
        垒球分析
      </button>
    </div>
    <span class="ver" id="ver" title="点击强制刷新到最新版本">v—</span>
  </div>
</div>

<div id="stage">
  <div id="load"><div class="spin"></div><div class="lt">正在载入分析引擎…</div></div>
  <div id="hint">切换上方标签可查看其他动作模式 · 已上传的视频不会丢失</div>
</div>

<script>
/* =====================================================================
   AI BASEBALL · 三模式外壳
   棒球投球 / 打击 / 垒球投球 三个原型各自独立运行在 iframe 内——
   CSS 与 JS 完全隔离，互不污染；iframe 并存，切换时状态（已上传视频、
   已截关键帧）保留。

   版本机制：
   - BUILD 是本文件的版本号，由发布脚本写入；页面顶栏直接显示。
   - 每次打开都会去取 version.json（带时间戳，绕过缓存）比对：
       · 不一致 → 说明线上有新版本 → 自动强制重载（带版本参数绕缓存）
       · 一致   → 已是最新，正常放行
   - iframe 也带版本参数，版本一变 URL 就变，同样不可能拿到旧的子页面。
   ===================================================================== */
const BUILD = '1.0.1';          // ← 由发布脚本自动写入，勿手改
const GUARD_KEY = 'aiball_reload_guard';

const META = {
  pitch: { file: 'pitch.html', label: '棒球投球' },
  hit:   { file: 'hit.html',   label: '打击分析' },
  soft:  { file: 'soft.html',  label: '垒球投球' }
};

const stage  = document.getElementById('stage');
const loadEl = document.getElementById('load');
const hintEl = document.getElementById('hint');
const verEl  = document.getElementById('ver');
const tabs   = Array.prototype.slice.call(document.querySelectorAll('.tab'));
const frames = {};      // mode -> iframe
const ready  = {};      // mode -> bool
let cur = null;

/* ---------- 版本号显示 ---------- */
if(verEl) verEl.textContent = 'v' + BUILD;

/* ---------- 强制更新检查 ---------- */
function softReload(reason){
  const url = new URL(location.href);
  url.searchParams.set('v', reason || String(Date.now()));
  location.replace(url.toString());
}

async function enforceLatest(){
  let remote = null;
  try{
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if(!r.ok) return;
    remote = await r.json();
  }catch(e){ return; }                                   // 离线 / file:// 打开 → 静默跳过

  if(!remote || !remote.version) return;

  if(verEl && remote.build){
    verEl.title = '构建于 ' + remote.build + (remote.note ? ' · ' + remote.note : '')
                + '（点击可强制刷新）';
  }

  if(remote.version === BUILD) return;                    // 已是最新

  /* 线上有更新版本 → 强制重载，绕过浏览器与 CDN 缓存 */
  const url = new URL(location.href);
  const tried = url.searchParams.get('v');

  if(tried === remote.version || Number(sessionStorage.getItem(GUARD_KEY) || 0) >= 2){
    /* 已经带着新版本号重载过，拿到的仍是旧页 → 缓存过于顽固，
       停止自动刷新（避免无限循环），改为提示用户手动刷新。 */
    if(verEl){
      verEl.classList.add('stale');
      verEl.textContent = 'v' + BUILD + ' ↑';
      verEl.title = '线上已有 v' + remote.version + '，本机缓存未更新 —— 点击强制刷新';
    }
    return;
  }

  try{ sessionStorage.setItem(GUARD_KEY, String(Number(sessionStorage.getItem(GUARD_KEY) || 0) + 1)); }catch(e){}
  if(loadEl){
    loadEl.classList.remove('off');
    const t = loadEl.querySelector('.lt');
    if(t) t.textContent = '发现新版本 v' + remote.version + '，正在更新…';
  }
  setTimeout(function(){ softReload(remote.version); }, 60);
}

/* ---------- 模式切换 ---------- */
function buildIframe(mode){
  if(frames[mode]) return frames[mode];
  const f = document.createElement('iframe');
  f.className = 'frame';
  f.title = META[mode].label;
  f.setAttribute('allow', 'fullscreen; autoplay; encrypted-media');
  f.addEventListener('load', function(){
    ready[mode] = true;
    if(mode === cur) hideLoad();
  });
  f.src = META[mode].file + '?v=' + BUILD;               // 版本参数 = 子页面也不会拿到旧的
  stage.appendChild(f);
  frames[mode] = f;
  return f;
}

let loadTimer = null;
function showLoad(){
  if(loadTimer) clearTimeout(loadTimer);
  loadEl.classList.remove('off');
}
function hideLoad(){
  loadTimer = setTimeout(function(){ loadEl.classList.add('off'); }, 120);
}

function show(mode, writeHash){
  if(!META[mode]) mode = 'pitch';
  if(cur === mode) return;

  buildIframe(mode);

  tabs.forEach(function(b){ b.classList.toggle('on', b.dataset.mode === mode); });
  Object.keys(frames).forEach(function(m){
    frames[m].classList.toggle('on', m === mode);
  });

  cur = mode;

  if(ready[mode]) hideLoad(); else showLoad();

  if(writeHash !== false){
    try{ history.replaceState(null, '', '#' + mode); }
    catch(e){ location.hash = mode; }
  }

  if(hintEl && mode !== 'pitch') hintEl.classList.add('off');
}

tabs.forEach(function(b){
  b.addEventListener('click', function(){ show(b.dataset.mode, true); });
});

/* 点版本徽章 = 手动强制刷新 */
if(verEl){
  verEl.addEventListener('click', function(){ softReload(); });
}

/* ---------- 启动：按 URL hash 决定初始模式（便于直接分享某一种模式） ---------- */
(function init(){
  const h = (location.hash || '').replace(/^#/, '').toLowerCase();
  show(META[h] ? h : 'pitch', false);
  try{ history.replaceState(null, '', '#' + cur); }catch(e){}
})();

window.addEventListener('hashchange', function(){
  const m = (location.hash || '').replace(/^#/, '').toLowerCase();
  if(META[m]) show(m, false);
});

/* 桌面端首次交互后淡出底部提示 */
if(hintEl){
  setTimeout(function(){ hintEl.classList.add('off'); }, 6000);
  document.addEventListener('click', function(){ hintEl.classList.add('off'); }, { once:true });
}

/* ---------- 检查更新（不阻塞首屏） ---------- */
enforceLatest();
</script>
</body>
</html>
