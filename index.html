<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#05080f">
<meta name="description" content="AI BASEBALL · 青少年棒球投球与打击动作分析（端侧姿态估计原型）">
<title>AI BASEBALL · 青少年棒球动作分析</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:#05080f;color:#e9f0ff;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex;flex-direction:column;
  }

  /* ---------- 顶部模式切换栏 ---------- */
  #bar{
    flex:none;position:relative;z-index:20;
    background:linear-gradient(180deg,#0d1729,#0a1120);
    border-bottom:1px solid #1f2c45;
    padding:calc(7px + env(safe-area-inset-top,0px)) 12px 7px;
  }
  .wrap{max-width:430px;margin:0 auto;display:flex;align-items:center;gap:9px}
  .brand{
    display:flex;align-items:center;gap:6px;flex:none;
    font-size:11px;font-weight:800;letter-spacing:.6px;color:#6b81a5;white-space:nowrap;
  }
  .brand .dot{
    width:7px;height:7px;border-radius:99px;flex:none;
    background:linear-gradient(135deg,#22d3ee,#3b82f6);
    box-shadow:0 0 8px rgba(34,211,238,.65);
  }
  .seg{
    display:flex;gap:3px;background:#0b1424;border:1px solid #1f2c45;
    border-radius:11px;padding:3px;flex:1;min-width:0;
  }
  .tab{
    flex:1;min-width:0;border:none;background:transparent;color:#93a8ca;
    font-family:inherit;font-size:12.5px;font-weight:700;letter-spacing:.2px;
    padding:8px 4px;border-radius:8px;cursor:pointer;white-space:nowrap;
    display:flex;align-items:center;justify-content:center;gap:5px;
    transition:background .18s ease,color .18s ease,box-shadow .18s ease;
  }
  .tab svg{flex:none;opacity:.9}
  .tab:active{transform:scale(.98)}
  .tab.on{
    background:linear-gradient(135deg,#1d4ed8,#0ea5e9);color:#fff;
    box-shadow:0 2px 10px rgba(29,78,216,.4);
  }
  @media(max-width:400px){ .brand{display:none} }

  /* ---------- 内容区 ---------- */
  #stage{flex:1;position:relative;min-height:0;background:#05080f}
  .frame{
    position:absolute;inset:0;width:100%;height:100%;border:0;
    display:none;background:#05080f;
  }
  .frame.on{display:block}

  /* ---------- 载入遮罩 ---------- */
  #load{
    position:absolute;inset:0;z-index:10;pointer-events:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    background:#05080f;opacity:1;transition:opacity .28s ease;
  }
  #load.off{opacity:0}
  .spin{
    width:26px;height:26px;border-radius:50%;
    border:2.5px solid #1f2c45;border-top-color:#3b82f6;
    animation:sp .8s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
  .lt{font-size:11.5px;color:#5f7398;letter-spacing:.4px}

  /* ---------- 底部提示（仅桌面端首屏） ---------- */
  @media(min-width:900px){
    #hint{
      position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
      font-size:11px;color:#3f5273;letter-spacing:.3px;z-index:11;
      pointer-events:none;transition:opacity .5s ease;
    }
    #hint.off{opacity:0}
  }
  @media(max-width:899px){ #hint{display:none} }
</style>
</head>
<body>

<div id="bar">
  <div class="wrap">
    <div class="brand"><span class="dot"></span>AI BASEBALL</div>
    <div class="seg" id="seg">
      <button class="tab on" data-mode="pitch" type="button">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="9"/><path d="M4.5 5.5c3 3 3.6 9.4 1.2 13M19.5 5.5c-3 3-3.6 9.4-1.2 13"/>
        </svg>
        投球分析
      </button>
      <button class="tab" data-mode="hit" type="button">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 3.5 20 9M17.5 6.5 8 16l-3.5 7L11 19.5 20.5 10z"/>
        </svg>
        打击分析
      </button>
    </div>
  </div>
</div>

<div id="stage">
  <div id="load"><div class="spin"></div><div class="lt">正在载入分析引擎…</div></div>
  <div id="hint">切换上方标签可查看另一种动作模式 · 已上传的视频不会丢失</div>
</div>

<script>
/* =====================================================================
   AI BASEBALL · 双模式外壳
   投球 / 打击两个原型各自独立运行在 iframe 内——CSS 与 JS 完全隔离，
   互不污染；两个 iframe 并存，切换时状态（已上传视频、已截关键帧）保留。
   ===================================================================== */
const META = {
  pitch: { file: 'pitch.html', label: '投球分析' },
  hit:   { file: 'hit.html',   label: '打击分析' }
};

const stage  = document.getElementById('stage');
const loadEl = document.getElementById('load');
const hintEl = document.getElementById('hint');
const tabs   = Array.prototype.slice.call(document.querySelectorAll('.tab'));
const frames = {};      // mode -> iframe
const ready  = {};      // mode -> bool
let cur = null;

function buildIframe(mode){
  if(frames[mode]) return frames[mode];
  const f = document.createElement('iframe');
  f.className = 'frame';
  f.title = META[mode].label;
  f.setAttribute('allow', 'fullscreen; autoplay; encrypted-media');
  f.addEventListener('load', function(){
    ready[mode] = true;
    if(mode === cur) hideLoad();
  });
  f.src = META[mode].file;
  stage.appendChild(f);
  frames[mode] = f;
  return f;
}

let loadTimer = null;
function showLoad(){
  if(loadTimer) clearTimeout(loadTimer);
  loadEl.classList.remove('off');
}
function hideLoad(){
  loadTimer = setTimeout(function(){ loadEl.classList.add('off'); }, 120);
}

function show(mode, writeHash){
  if(!META[mode]) mode = 'pitch';
  if(cur === mode) return;

  buildIframe(mode);

  tabs.forEach(function(b){ b.classList.toggle('on', b.dataset.mode === mode); });
  Object.keys(frames).forEach(function(m){
    frames[m].classList.toggle('on', m === mode);
  });

  cur = mode;

  if(ready[mode]) hideLoad(); else showLoad();

  if(writeHash !== false){
    try{ history.replaceState(null, '', '#' + mode); }
    catch(e){ location.hash = mode; }
  }

  if(hintEl && mode === 'hit') hintEl.classList.add('off');
}

tabs.forEach(function(b){
  b.addEventListener('click', function(){ show(b.dataset.mode, true); });
});

/* ---------- 启动：按 URL hash 决定初始模式（便于直接分享某一种模式） ---------- */
(function init(){
  const h = (location.hash || '').replace(/^#/, '').toLowerCase();
  show(META[h] ? h : 'pitch', false);
  /* 首次进入时把 hash 补上，方便复制当前模式链接 */
  try{ history.replaceState(null, '', '#' + cur); }catch(e){}
})();

window.addEventListener('hashchange', function(){
  const m = (location.hash || '').replace(/^#/, '').toLowerCase();
  if(META[m]) show(m, false);
});

/* 桌面端首次交互后淡出底部提示 */
if(hintEl){
  setTimeout(function(){ hintEl.classList.add('off'); }, 6000);
  document.addEventListener('click', function(){ hintEl.classList.add('off'); }, { once:true });
}
</script>
</body>
</html>
